# Start once per inspection session. Collection itself archives native OTel
# locally; import-otel sends retained observations here after measurement.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318
exporters:
  file/traces:
    path: ${env:MBTX_OTEL_ARCHIVE}/traces.jsonl
  file/logs:
    path: ${env:MBTX_OTEL_ARCHIVE}/logs.jsonl
  otlphttp/signoz:
    endpoint: ${env:MBTX_SIGNOZ_OTLP_ENDPOINT}
service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [file/traces, otlphttp/signoz]
    logs:
      receivers: [otlp]
      exporters: [file/logs, otlphttp/signoz]
