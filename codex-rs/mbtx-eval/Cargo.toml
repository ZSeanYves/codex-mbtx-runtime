[package]
name = "codex-mbtx-eval"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mbtx-eval"
path = "src/main.rs"

[[bin]]
name = "mbtx-fixture-worker"
path = "src/fixture_worker.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
flate2 = { workspace = true }
axum = { workspace = true, features = ["http1", "json", "tokio"] }
bytes = { workspace = true }
clap = { workspace = true, features = ["derive"] }
codex-rollout-trace = { workspace = true }
futures = { workspace = true }
httpdate = { workspace = true }
libc = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream", "rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-stream = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
walkdir = { workspace = true }
which = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
tempfile = { workspace = true }
pretty_assertions = { workspace = true }
