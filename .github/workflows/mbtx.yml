name: MBTX validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      offline:
        type: boolean
        default: true
        description: Build one bundle and run actual Codex offline validation

permissions:
  contents: read

concurrency:
  group: mbtx-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.paths.outputs.code }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: moonbitlang/moonbit-docs/.github/actions/setup@474bc051f101bfe88d8d6a1889b2f49c60f78de0
      - id: paths
        run: moon run mbtx/scripts/ci-changes.mbtx

  fast:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just,cargo-nextest
      - uses: moonbitlang/moonbit-docs/.github/actions/setup@474bc051f101bfe88d8d6a1889b2f49c60f78de0
      - uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codex-rs/target
          key: mbtx-fast-${{ runner.os }}-dev-debug0-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml', 'codex-rs/mbtx-eval/**', 'codex-rs/ext/mbtx/**') }}
          restore-keys: mbtx-fast-${{ runner.os }}-dev-debug0-
      - run: moon run mbtx/scripts/validate-evaluation.mbtx --fast
      - run: cargo fmt --all -- --check
        working-directory: codex-rs
      - run: moon fmt --check
        working-directory: mbtx

  offline:
    needs: fast
    if: github.event_name == 'workflow_dispatch' && inputs.offline
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just,cargo-nextest,ripgrep
      - uses: moonbitlang/moonbit-docs/.github/actions/setup@474bc051f101bfe88d8d6a1889b2f49c60f78de0
      - uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codex-rs/target
          key: mbtx-offline-${{ runner.os }}-wasm-dev-debug0-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml', 'codex-rs/**/*.rs', 'mbtx/**/*.mbt', 'mbtx/**/*.mbtx', 'mbtx/moon.mod') }}
          restore-keys: mbtx-fast-${{ runner.os }}-dev-debug0-
      - run: moon run mbtx/scripts/validate-evaluation.mbtx
      - if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: programmable-mbtx-offline
          path: |
            _build/long-study-validation
            _build/retry-validation
            _build/observation-calibration
            !_build/long-study-validation/**/workspaces/**
            !_build/retry-validation/**/workspaces/**
            !_build/observation-calibration/**/workspaces/**
            _build/evaluation-bundles/preparation-*.json

  required:
    name: MBTX required
    if: always()
    needs: [changes, fast, offline]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate validation results
        env:
          ACCEPTED: ${{ needs.changes.result == 'success' && (needs.fast.result == 'success' || (needs.changes.outputs.code == 'false' && needs.fast.result == 'skipped')) && (needs.offline.result == 'success' || (needs.offline.result == 'skipped' && !(github.event_name == 'workflow_dispatch' && inputs.offline))) }}
        run: test "$ACCEPTED" = true
